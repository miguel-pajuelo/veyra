name: Validate project foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository, privacy and syntax in PowerShell 7
        shell: pwsh
        run: ./tests/Test-Repository.ps1
      - name: Verify restoration in PowerShell 7
        shell: pwsh
        run: ./tests/Test-Restoration.ps1
      - name: Check repository, privacy and syntax in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Repository.ps1
      - name: Verify restoration in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Restoration.ps1
